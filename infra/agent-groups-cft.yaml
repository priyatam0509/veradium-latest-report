AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Agent Groups backend for The Ticket Clinic Dashboard.
  Provisions a DynamoDB table, a Lambda CRUD handler, and an HTTP API Gateway
  so that agent groups are stored centrally and shared across all users
  (any user can create a group and every user sees it).

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name (used in the invoke URL path).
  CorsAllowOrigin:
    Type: String
    Default: '*'
    Description: >
      Allowed CORS origin for the dashboard. Use '*' for any origin, or set to
      your dashboard URL (e.g. https://main.dxxxx.amplifyapp.com) to lock it down.
  QueryApiUrl:
    Type: String
    Default: 'https://16rzda4gyd.execute-api.us-east-1.amazonaws.com/prod/query'
    Description: Reporting query API used to look up a user's TIER (rbac_users_get_tier_tag).
  UserRegionApiUrl:
    Type: String
    Default: 'https://4aeeztzo8c.execute-api.us-east-1.amazonaws.com/prod/user-region'
    Description: User-region service used to look up a user's assigned region.
  QueryApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      x-api-key for the query API, used ONLY by the tier lookup (rbac_users_get_tier_tag).
      DynamoDB access uses the Lambda IAM role, not this key. Pass at deploy time via
      --parameter-overrides QueryApiKey=... ; never commit it.

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB — one row per agent group. Partition key: id (uuid).
  # ---------------------------------------------------------------------------
  AgentGroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-agent-groups'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------------------------------------------------------------------------
  # IAM role for the Lambda — CloudWatch logs + CRUD on the table only.
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentGroupsTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt AgentGroupsTable.Arn

  # ---------------------------------------------------------------------------
  # Lambda — single handler routes GET/POST/PUT/DELETE for agent groups.
  # ---------------------------------------------------------------------------
  AgentGroupsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-agent-groups'
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 29
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref AgentGroupsTable
          QUERY_API_URL: !Ref QueryApiUrl
          USER_REGION_API_URL: !Ref UserRegionApiUrl
          QUERY_API_KEY: !Ref QueryApiKey
      Code:
        ZipFile: |
          const { DynamoDBClient, ScanCommand, PutItemCommand, GetItemCommand, DeleteItemCommand } = require("@aws-sdk/client-dynamodb");
          const { marshall, unmarshall } = require("@aws-sdk/util-dynamodb");
          const crypto = require("crypto");
          const db = new DynamoDBClient({});
          const T = process.env.TABLE_NAME, QURL = process.env.QUERY_API_URL, RURL = process.env.USER_REGION_API_URL, KEY = process.env.QUERY_API_KEY || "";
          const json = (s, d) => ({ statusCode: s, headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
          const norm = (u) => (u ? String(u).replace(/@.*$/, "@TheTicketClinic.com") : "");
          const lc = (x) => (x ? String(x).toLowerCase() : "");
          async function getTier(u) {
            try {
              const r = await fetch(QURL, { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": KEY }, body: JSON.stringify({ queryName: "rbac_users_get_tier_tag", parameters: { username: u }, waitForResults: true, maxWaitTime: 25 }) });
              const d = await r.json();
              if (d && d.status === "SUCCEEDED" && d.data && d.data.length) return d.data[0].tier || null;
            } catch (e) {}
            return null;
          }
          async function getRegion(u) {
            const l = String(u).replace(/@.*$/, "");
            for (const c of [l + "@TheTicketClinic.com", l + "@theticketclinic.com"]) {
              try { const r = await fetch(RURL + "?username=" + encodeURIComponent(c)); const d = await r.json(); if (d && (d.found === 1 || d.found === true)) return d.region || null; } catch (e) {}
            }
            return null;
          }
          const canEdit = (g, tier, region, u) =>
            tier === "SUPERUSER" ||
            (tier === "MANAGER-REGION" && !!g.region && !!region && lc(g.region) === lc(region)) ||
            (!!g.createdBy && !!u && lc(g.createdBy) === lc(u));
          exports.handler = async (event) => {
            const m = (event.requestContext && event.requestContext.http && event.requestContext.http.method) || "GET";
            const id = event.pathParameters && event.pathParameters.id;
            const h = event.headers || {};
            const who = norm(h["x-user-email"] || h["X-User-Email"] || "");
            let b = {};
            if (event.body) { try { b = JSON.parse(event.body); } catch (e) { return json(400, { error: "Bad JSON" }); } }
            try {
              if (m === "GET") {
                const res = await db.send(new ScanCommand({ TableName: T }));
                return json(200, (res.Items || []).map(unmarshall));
              }
              if (!who) return json(401, { error: "no id" });
              if (m === "POST") {
                if (!b.name || !Array.isArray(b.agents)) return json(400, { error: "bad input" });
                const region = await getRegion(who), now = new Date().toISOString();
                const item = { id: crypto.randomUUID(), name: String(b.name).trim(), agents: b.agents.map(String), agentNames: Array.isArray(b.agentNames) ? b.agentNames.map(String) : [], createdBy: who, region: region || "", createdAt: now, updatedAt: now };
                await db.send(new PutItemCommand({ TableName: T, Item: marshall(item, { removeUndefinedValues: true }) }));
                return json(201, item);
              }
              if (m === "PUT" || m === "PATCH" || m === "DELETE") {
                if (!id) return json(400, { error: "no id" });
                const ex = await db.send(new GetItemCommand({ TableName: T, Key: marshall({ id }) }));
                if (!ex.Item) return json(404, { error: "404" });
                const g = unmarshall(ex.Item);
                const [tier, region] = await Promise.all([getTier(who), getRegion(who)]);
                if (!canEdit(g, tier, region, who)) return json(403, { error: "Forbidden" });
                if (m === "DELETE") { await db.send(new DeleteItemCommand({ TableName: T, Key: marshall({ id }) })); return json(200, { success: true, id }); }
                const up = Object.assign({}, g, { updatedAt: new Date().toISOString() });
                if (b.name !== undefined) up.name = String(b.name).trim();
                if (b.agents !== undefined) up.agents = b.agents.map(String);
                if (b.agentNames !== undefined) up.agentNames = b.agentNames.map(String);
                await db.send(new PutItemCommand({ TableName: T, Item: marshall(up, { removeUndefinedValues: true }) }));
                return json(200, up);
              }
              return json(405, { error: "405" });
            } catch (err) { return json(500, { error: err.message || "Error" }); }
          };
  # ---------------------------------------------------------------------------
  # HTTP API Gateway (v2) — built-in CORS, cheaper/simpler than REST API.
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-agent-groups-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - x-user-email
        MaxAge: 300

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentGroupsFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  RouteList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /agent-groups'
      Target: !Sub 'integrations/${ApiIntegration}'

  RouteCreate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /agent-groups'
      Target: !Sub 'integrations/${ApiIntegration}'

  RouteUpdate:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /agent-groups/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'

  RouteDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /agent-groups/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref StageName
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentGroupsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  AgentGroupsEndpoint:
    Description: >
      Full endpoint for the frontend. Set this as NEXT_PUBLIC_AGENT_GROUPS_API
      (or paste into lib/agent-groups-service.ts).
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/agent-groups'
  ApiBaseUrl:
    Description: Base invoke URL of the HTTP API.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  TableName:
    Description: DynamoDB table storing the agent groups.
    Value: !Ref AgentGroupsTable
